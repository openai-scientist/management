name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['**']
  merge_group:
  release:
    types: [published]
  schedule:
    - cron: '21 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://platform:platform@127.0.0.1:5432/platform
      PLATFORM_POSTGRES_TEST_URL: postgresql+asyncpg://platform:platform@127.0.0.1:5432/platform
      APP_ENV: test
      FIREBASE_PROJECT_ID: ai-research-platform-4ceb9
      SESSION_SIGNING_SECRET: ci-only-session-signing-secret-change-me
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Select affected tests once
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            uv run python scripts/affected_tests.py --base "origin/$TARGET_BRANCH" --output "$RUNNER_TEMP/test-selection.json"
          else
            uv run python scripts/affected_tests.py --full --output "$RUNNER_TEMP/test-selection.json"
          fi
      - run: uv run ruff format --check src alembic tests scripts
      - run: uv run ruff check src alembic tests scripts
      - run: uv run lint-imports
      - run: uv run alembic upgrade head
      - name: Run selected tests
        shell: bash
        run: uv run python scripts/affected_tests.py --run-plan "$RUNNER_TEMP/test-selection.json"
      - run: docker build --file docker/Dockerfile --tag ai-research-platform-be:ci .

  gate:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all checks to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/affected_tests.py --gate "$CHECK_RESULTS"
