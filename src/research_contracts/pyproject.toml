[project]
name = "research-contracts"
version = "1.0.0"
description = "Shared research engine schemas and contract testing tools."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
testing = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[dependency-groups]
dev = ["ruff>=0.8,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
include = ["*.py", "testing/**/*.py"]
exclude = ["tests/**", "**/__pycache__/**", ".venv/**", "dist/**"]

[tool.hatch.build.targets.wheel.sources]
"" = "research_contracts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["research_contracts"]
